<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جورنال 999 — أخبار عالمية وذكاء اصطناعي</title>
<meta name="description" content="جورنال 999: أخبار عالمية بالعربية والفرنسية والإنجليزية مع ملخصات بالذكاء الاصطناعي وقنوات مباشرة وكرة القدم.">
<link rel="alternate" hreflang="fr" href="/fr/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="ar" href="/ar/">
<script>try{localStorage.setItem("j999_lang","ar")}catch(e){}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3266873353292561" async crossorigin="anonymous"></script>
<script src="../i18n.js" defer></script>
<script src="../app.js" defer></script>
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen font-sans">
<header class="border-b border-gray-800 bg-[#0a0d14] sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
    <div>
      <h1 class="text-2xl font-black text-yellow-400 tracking-tight">JOURNAL 999</h1>
      <p class="text-xs text-gray-400">أخبار عالمية وذكاء اصطناعي</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <nav class="flex gap-1 text-xs font-bold" aria-label="Language">
        <a href="../fr/" class="px-2 py-1 rounded bg-gray-800">FR</a>
        <a href="../en/" class="px-2 py-1 rounded bg-gray-800">EN</a>
        <a href="../ar/" class="px-2 py-1 rounded bg-yellow-400 text-black">AR</a>
      </nav>
      <button id="mode-btn" type="button" onclick="toggleLiteMode()"></button>
      <button type="button" onclick="openPricingModal()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-yellow-400 text-black" data-i18n="Premium"></button>
      <button id="admin-badge" type="button" onclick="openAdmin()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-800" data-i18n="Admin"></button>
      <div id="google-signin-btn"></div>
      <span id="user-badge" class="hidden text-xs bg-gray-800 px-3 py-1.5 rounded-lg"></span>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex flex-col sm:flex-row gap-2 mb-4">
    <input id="search-input" type="search" data-i18n-ph="SearchPlaceholder" class="flex-1 bg-[#0d111a] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400">
    <button type="button" onclick="doSearch()" class="bg-yellow-400 text-black font-bold px-6 py-3 rounded-xl text-sm" data-i18n="SearchBtn"></button>
  </div>

  <div class="flex flex-wrap gap-2 mb-4">
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="mondial" onclick="setTab('mondial')" data-i18n="Tab1"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="journaux" onclick="setTab('journaux')" data-i18n="Tab2"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="financial" onclick="setTab('financial')" data-i18n="Tab3"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="economic" onclick="setTab('economic')" data-i18n="Tab4"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="sport" onclick="setTab('sport')" data-i18n="Tab5"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="foot" onclick="setTab('foot')" data-i18n="Tab6"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="live" onclick="setTab('live')" data-i18n="Tab7"></button>
    <button type="button" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-[#0d111a] border border-gray-800 hover:border-yellow-500/50" data-tab="tv" onclick="setTab('tv')" data-i18n="TabTV"></button>
  </div>

  <div id="newspaper-dropdown-container" class="hidden mb-4">
    <select id="newspaper-select" onchange="onNewspaperChange(this.value)" class="w-full sm:w-80 bg-[#0d111a] border border-gray-700 rounded-xl px-4 py-3 text-sm">
      <option value="" data-i18n="SelectPaper"></option>
      <option value="France 24">France 24</option>
      <option value="Al Jazeera">Al Jazeera</option>
      <option value="BBC News">BBC News</option>
      <option value="RFI">RFI</option>
      <option value="Le Monde">Le Monde</option>
      <option value="Le Figaro">Le Figaro</option>
      <option value="The New York Times">The New York Times</option>
      <option value="L'Équipe">L'Équipe</option>
      <option value="Marca">Marca</option>
      <option value="Echourouk">Echourouk</option>
    </select>
  </div>

  <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<footer class="max-w-6xl mx-auto px-4 py-8 text-center text-xs text-gray-500">
  © 2026 Journal 999 · <a class="underline" href="../privacy.html">الخصوصية</a>
</footer>

<div id="modal" class="hidden fixed inset-0 bg-black/80 z-50 items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-[#0d111a] border border-gray-700 rounded-2xl p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto relative">
    <button type="button" onclick="closeModal()" aria-label="Close" class="absolute top-3 end-4 text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
    <div id="modal-content" class="mt-2"></div>
  </div>
</div>
</body>
</html>
