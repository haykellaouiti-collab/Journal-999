<title>Journal 999 — Global AI News</title>
<script>
  (function () {
    var ok = { fr: 1, en: 1, ar: 1 };
    var lang = null;
    try { lang = localStorage.getItem("j999_lang"); } catch (e) {}
    if (!lang || !ok[lang]) {
      var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
      lang = ok[nav] ? nav : "en";
    }
    window.location.replace("./" + lang + "/");
  })();
</script>
</head>
